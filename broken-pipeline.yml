name: CI/CD Pipeline - Fixed

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Gradle Test & Build JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập môi trường JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # ========================================================
      # KHẮC PHỤC LỖI 1 (Permission Denied):
      # Cấp quyền thực thi (+x) cho Gradle Wrapper trước khi chạy test
      # ========================================================
      - name: Cấp quyền thực thi cho Gradle Wrapper
        run: chmod +x gradlew

      - name: Chạy Unit Tests
        run: ./gradlew test

      - name: Đóng gói ứng dụng JAR
        run: ./gradlew bootJar -x test

  docker-build:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================================
      # KHẮC PHỤC LỖI 2 (Authentication Failed):
      # Sửa đúng tên biến Secret REGISTRY_TOKEN (tránh lỗi chính tả / sai tên biến)
      # ========================================================
      - name: Đăng nhập vào GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # ========================================================
      # KHẮC PHỤC LỖI 3 (Build Context Error):
      # Chỉ định đúng context: . (thư mục gốc) và file: ./Dockerfile
      # ========================================================
      - name: Build và Push Docker Image lên GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spring-boot-app:latest
            ghcr.io/${{ github.repository_owner }}/spring-boot-app:${{ github.sha }}
